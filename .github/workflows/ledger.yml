name: ledger

# Public Solana IDL drift ledger: run idl-drift over the curated program list
# in ledger/programs.json against live mainnet, then commit the regenerated
# ledger/README.md and ledger/index.html back so the ledger stays browsable
# even without Pages enabled.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *" # daily 05:17 UTC

permissions:
  contents: write

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate ledger
        run: node ledger/run.mjs
      - name: Commit refreshed ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # run.mjs writes three files: the ledger table, the published page and
          # the root README's refresh-status block. Staging only the first two
          # left the root block a run behind, which is exactly what
          # ledger/check-freshness.mjs reported as "the status sentence outran
          # its data". Stage all three or the guard fails the next schedule.
          git add ledger/README.md ledger/index.html README.md
          if ! git diff --cached --quiet; then
            git commit -m "ledger: refresh $(date -u +%F) [skip ci]"
            git push
          fi
      - name: Publish GitHub Pages
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST repos/${{ github.repository }}/pages \
            -f source[branch]=master -f source[path]=/ 2>/dev/null || true
